# 前端 Nginx：托管静态资源 + 反代 /api 到后端容器 + 限流
# 关键点：
#   1. SSE 流式必须关闭缓冲，否则回答会「憋着一次性蹦出来」，
#      急症预警卡片也就无法第一个到达前端；
#   2. 对话接口按 IP 限流 —— 一次问诊要 3~5 秒且消耗大模型额度，
#      不限流的话一个 for 循环就能把服务打死并烧掉配额。

# ---- 限流区（http 上下文，conf.d 里的文件即处于该上下文）----
# 对话：每分钟 10 次，允许突发 5（用户连点几下不会立刻 429）
limit_req_zone $binary_remote_addr zone=chat_zone:10m rate=10r/m;
# 其它接口：每分钟 120 次
limit_req_zone $binary_remote_addr zone=api_zone:10m rate=120r/m;
limit_req_status 429;

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 1m;

    # 容器存活探针（只证明 nginx 还活着）
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # 对话接口：独立限流 + SSE 不缓冲
    location /api/chat/ {
        limit_req zone=chat_zone burst=5 nodelay;

        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # ---- SSE / 流式必须项 ----
        proxy_buffering    off;
        proxy_cache        off;
        proxy_set_header   Connection '';
        chunked_transfer_encoding on;

        proxy_connect_timeout 10s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;
    }

    # 其它后端接口
    location /api/ {
        limit_req zone=api_zone burst=40 nodelay;

        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_send_timeout    60s;
        proxy_read_timeout    120s;
    }

    # 单页应用路由回退
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 静态资源缓存
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}

